[package]
name = "rcircuit-trainer"
version = "0.1.0"
edition = "2021"

[dependencies]
tch = "0.13.0"
rand = "=0.8.5"
neuralarena-cdk = {version = "0.1.0", path = "../neuralarena-cdk"}
rcircuit-engine = {version = "0.1.0", path = "../rcircuit-engine"}
three-rs = {version = "0.1.0", path = "../three-rs", features = ["renderer"]}
gltf = {version = "1.4.0", features = ["import"]}
sdl2 = "0.36"

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
